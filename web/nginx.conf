server {
    listen 80;
    server_name _;

    # ── Gzip para assets estáticos ────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ── Frontend SPA (React Router) ───────────────────────────
    # Serve os arquivos estáticos gerados pelo Vite.
    # O try_files garante que qualquer rota do React Router
    # (ex: /transactions, /settings) carregue o index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy Reverso para o Backend Rust ─────────────────────
    # Toda requisição que começa com /api/ é encaminhada para
    # o container do backend na porta 3333.
    location /api/ {
        proxy_pass         http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Cache de assets estáticos ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
