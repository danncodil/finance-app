# ══════════════════════════════════════════════════════════════
# FinanceApp — Docker Compose (Produção)
#
# Orquestra 3 serviços:
#   1. db       → PostgreSQL 16 com volume persistente
#   2. backend  → API REST em Rust/Axum (porta 3333)
#   3. frontend → React servido por Nginx (porta 80)
#
# Como rodar:
#   docker compose up -d --build
#
# Como acompanhar os logs:
#   docker compose logs -f
#
# Como parar tudo:
#   docker compose down
#
# Como resetar tudo (incluindo o banco):
#   docker compose down -v
# ══════════════════════════════════════════════════════════════

services:
  # ────────────────────────────────────────────────────────────
  # 1. Banco de Dados (PostgreSQL)
  # ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: financeapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeapp
      POSTGRES_PASSWORD: financeapp_secret_2026
      POSTGRES_DB: gestao_financeira
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U financeapp -d gestao_financeira" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────────────────────────────────────────
  # 2. Backend (Rust / Axum)
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeapp_backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      # Conexão com o banco via hostname do container 'db'
      DATABASE_URL: postgres://financeapp:financeapp_secret_2026@db:5432/gestao_financeira
      DATABASE_MAX_CONNECTIONS: 10
      HOST: 0.0.0.0
      PORT: 3333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # ⚠️  TROQUE esta chave antes de ir para produção real!
      JWT_SECRET: PROD_SUPER_SECRETA_FINANCEAPP_2026_TROQUE_ESTA_CHAVE
      JWT_ACCESS_EXPIRATION_MINUTES: 60
      JWT_REFRESH_EXPIRATION_DAYS: 7
      RUST_LOG: gestao_financeira=info,tower_http=info
    depends_on:
      db:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────
  # 3. Frontend (React / Vite → Nginx)
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: financeapp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ── Volumes Persistentes ─────────────────────────────────────
volumes:
  pgdata:
    name: financeapp_pgdata
